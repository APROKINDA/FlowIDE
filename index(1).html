<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flow IDE</title>
<style>
:root{--bg:#10101b;--panel:#171626;--panel2:#1d1b31;--line:#302c49;--fg:#eeeafa;--muted:#9c96b8;--accent:#8065ff;--accent2:#b09aff;--good:#68dfa1;--bad:#ff748c}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui,Segoe UI,sans-serif;height:100vh;overflow:hidden}button{background:#25223a;border:1px solid var(--line);border-radius:8px;color:var(--fg);padding:9px 13px;font-weight:600;cursor:pointer}button:hover{border-color:var(--accent)}button.primary{background:var(--accent);border-color:var(--accent);color:white}.top{height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;background:#131220;border-bottom:1px solid var(--line)}.logo{font-size:25px;font-weight:800;color:var(--accent2)}.tagline{color:var(--muted);border-left:1px solid var(--line);padding-left:12px}.righttop{margin-left:auto;display:flex;gap:8px}.toolbar{height:54px;display:flex;gap:8px;align-items:center;padding:0 12px;border-bottom:1px solid var(--line);overflow:auto}.toolbar button{white-space:nowrap}.layout{height:calc(100vh - 112px);display:grid;grid-template-columns:220px minmax(240px,1fr) 320px}.side,.right{background:var(--panel);min-height:0}.side{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line);display:flex;flex-direction:column}.head{padding:13px 14px;border-bottom:1px solid var(--line);font-weight:700;color:#c7c1e2}.tree{padding:10px}.file{padding:9px 10px;border-radius:6px;cursor:pointer;color:#c9c4de}.file:hover,.file.active{background:#2b2647;color:white}.editorarea{display:flex;min-width:0;flex-direction:column}.tab{height:40px;background:#191728;border-bottom:1px solid var(--line);padding:11px 15px;color:#d4cfff}.editrow{display:flex;flex:1;min-height:0;font:14px/1.7 Consolas,monospace}.numbers{width:48px;flex-shrink:0;overflow:hidden;background:#141321;color:#625c7c;text-align:right;padding:12px 10px;white-space:pre;user-select:none}.editor{flex:1;resize:none;border:0;outline:0;background:#11111c;color:#e9e5fb;padding:12px 16px;white-space:pre;overflow:auto;font:inherit;tab-size:4}.status{height:27px;background:#1a172a;border-top:1px solid var(--line);padding:5px 10px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between}.tabs{display:flex;border-bottom:1px solid var(--line}.tabs button{flex:1;border:0;border-radius:0;background:transparent;color:var(--muted)}.tabs button.sel{border-bottom:2px solid var(--accent);color:white}.console{padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word;font:13px/1.6 Consolas,monospace;flex:1}.cgood{color:var(--good)}.cerr{color:var(--bad)}.cmuted{color:var(--muted)}.modalshade{display:none;position:fixed;inset:0;background:#0009;z-index:4;align-items:center;justify-content:center;padding:15px}.modal{background:#1b192b;border:1px solid #454060;border-radius:13px;max-width:650px;width:100%;max-height:85vh;overflow:auto;padding:20px}.modal h2{margin-top:0}.modal p{color:#b4aec9;line-height:1.6}.tutorial{display:grid;gap:10px}.lesson{border:1px solid var(--line);border-radius:9px;padding:12px;background:#131220}.lesson h3{margin:0 0 8px;color:var(--accent2)}.lesson pre{white-space:pre-wrap;background:#0c0b14;padding:9px;border-radius:7px;color:#bdf4ce}.modal input{width:100%;padding:12px;border-radius:7px;background:#10101b;color:white;border:1px solid var(--line)}.modalfooter{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}
@media(max-width:850px){.layout{grid-template-columns:170px minmax(200px,1fr)}.right{display:none}}@media(max-width:560px){.layout{grid-template-columns:1fr}.side{display:none}.tagline{display:none}.toolbar{padding:0 7px}.toolbar button{padding:8px 10px}}
</style></head><body>
<header class="top"><div class="logo">∿ Flow</div><div class="tagline">Code · Run · Create</div><div class="righttop"><button id="tutorialBtn">Tutorial</button><button id="devBtn">Dev Mode</button></div></header>
<nav class="toolbar"><button id="newBtn">＋ New</button><button id="openBtn">Open</button><button id="saveBtn">Save</button><button class="primary" id="runBtn">▶ Run</button><button id="checkBtn">Check</button></nav>
<main class="layout"><aside class="side"><div class="head">Explorer</div><div class="tree"><div class="file active" id="starterFile">▤ main.Flow</div><div class="file" id="exampleFile">▤ example.Flow</div><div class="file" id="docsFile">▤ Syntax.doc_Flow</div></div></aside>
<section class="editorarea"><div class="tab" id="filename">main.Flow</div><div class="editrow"><div class="numbers" id="numbers">1</div><textarea class="editor" id="source" spellcheck="false" autocapitalize="off"></textarea></div><div class="status"><span>Flow IDE v0.1</span><span id="cursorInfo">Line 1</span></div></section>
<aside class="right"><div class="tabs"><button class="sel" data-tab="console">Console</button><button data-tab="output">Output</button><button data-tab="errors">Errors</button></div><div class="console" id="console"><span class="cmuted">Welcome! Click Run to execute Flow code.</span></div></aside></main>
<div class="modalshade" id="shade"><section class="modal" id="modal"></section></div><input type="file" id="filePicker" accept=".Flow,.flow,.doc_Flow,.txt" hidden>
<script>
const $=id=>document.getElementById(id), editor=$('source');let currentFile='main.Flow',activeTab='console',consoleEntries=[],outputEntries=[],errorEntries=[];
const starter=`// Flow starter\nstr Name = "Player"\nint X = 7\n\nSay("Hello " + Name)\nIf X > 5\nSay("A")\nSay("B")\nSay("C")\nSay("Done")`;
const example=`// Example: brace blocks and loops\nint Count = 3\nWhile Count > 0 {\n    Say("Count is " + Count)\n    Count = Count - 1\n}\nSay("Finished")`;
editor.value=starter;updateLines();
function updateLines(){let n=editor.value.split('\n').length;$('numbers').textContent=Array.from({length:n},(_,i)=>i+1).join('\n');let line=editor.value.slice(0,editor.selectionStart).split('\n').length;$('cursorInfo').textContent='Line '+line}editor.addEventListener('input',updateLines);editor.addEventListener('keyup',updateLines);editor.addEventListener('click',updateLines);editor.addEventListener('scroll',()=>$('numbers').scrollTop=editor.scrollTop);editor.addEventListener('keydown',e=>{if(e.key==='Tab'){e.preventDefault();editor.setRangeText('    ',editor.selectionStart,editor.selectionEnd,'end');updateLines()}});
function escapeHTML(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function paintConsole(){let list=activeTab==='output'?outputEntries:activeTab==='errors'?errorEntries:consoleEntries;$('console').innerHTML=list.length?list.map(x=>`<div class="${x.cls||'cmuted'}">${escapeHTML(x.text)}</div>`).join(''):`<span class="cmuted">No ${activeTab} yet.</span>`}function addLog(text,cls='cmuted',tab='console'){({console:consoleEntries,output:outputEntries,errors:errorEntries}[tab]).push({text,cls});if(activeTab===tab)paintConsole()}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('sel',x===b));paintConsole()});
function showModal(html){$('modal').innerHTML=html;$('shade').style.display='flex'}function closeModal(){$('shade').style.display='none'}$('shade').onclick=e=>{if(e.target===$('shade'))closeModal()};window.closeModal=closeModal;
$('newBtn').onclick=()=>{editor.value='';currentFile='untitled.Flow';$('filename').textContent=currentFile;updateLines()};$('openBtn').onclick=()=>$('filePicker').click();$('filePicker').onchange=async e=>{let f=e.target.files[0];if(!f)return;editor.value=await f.text();currentFile=f.name;$('filename').textContent=currentFile;updateLines();e.target.value=''};$('saveBtn').onclick=()=>{let blob=new Blob([editor.value],{type:'text/plain'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=currentFile.endsWith('.Flow')||currentFile.endsWith('.doc_Flow')?currentFile:currentFile+'.Flow';a.click();URL.revokeObjectURL(url)};
$('starterFile').onclick=()=>{editor.value=starter;currentFile='main.Flow';$('filename').textContent=currentFile;updateLines()};$('exampleFile').onclick=()=>{editor.value=example;currentFile='example.Flow';$('filename').textContent=currentFile;updateLines()};$('docsFile').onclick=showTutorial;
// Small Flow interpreter: line-based statements, single-statement unbraced bodies, brace blocks.
function tokenize(src){let tokens=[],buf='',q='',esc=false,line=1;for(let i=0;i<src.length;i++){let c=src[i];if(q){buf+=c;if(esc)esc=false;else if(c==='\\')esc=true;else if(c===q)q='';continue}if(c==='"'||c==="'"){q=c;buf+=c;continue}if(c==='{'||c==='}'){if(buf.trim())tokens.push({s:buf.trim(),line});buf='';tokens.push({s:c,line});continue}if(c==='\n'){if(buf.trim())tokens.push({s:buf.trim(),line});buf='';line++;continue}buf+=c}if(buf.trim())tokens.push({s:buf.trim(),line});return tokens}
function parse(src){let t=tokenize(src),i=0;function body(){if(t[i]?.s==='{'){i++;let a=[];while(i<t.length&&t[i].s!=='}')a.push(stmt());if(t[i]?.s!=='}')throw Error('Missing closing brace');i++;return a}return[stmt()]}function stmt(){if(!t[i])throw Error('Expected statement');let tok=t[i++],s=tok.s,L=tok.line;if(s==='}')throw Error('Unexpected closing brace at line '+L);if(/^If\b/i.test(s)){let c=s.replace(/^If\s*/i,'').replace(/^\((.*)\)$/,'$1'),yes=body(),no=[];if(/^Else\b/i.test(t[i]?.s||'')){i++;no=body()}return{type:'if',c,yes,no,line:L}}if(/^While\b/i.test(s)){let c=s.replace(/^While\s*/i,'').replace(/^\((.*)\)$/,'$1');return{type:'while',c,b:body(),line:L}}return{type:'simple',s,line:L}}let ast=[];while(i<t.length)ast.push(stmt());return ast}
function evalExpr(expr,v){let x=expr.trim().replace(/\btrue\b/gi,'true').replace(/\bfalse\b/gi,'false').replace(/\band\b/gi,'&&').replace(/\bor\b/gi,'||').replace(/\bnot\b/gi,'!');x=x.replace(/\b([A-Za-z_]\w*)\b/g,m=>{if(['true','false','null'].includes(m))return m;if(m in v)return 'v['+JSON.stringify(m)+']';return m});if(!/^[\w\s.+\-*/%()!<>=&|,"'\[\]]+$/.test(x))throw Error('Unsupported expression: '+expr);return Function('v','return ('+x+')')(v)}
function checkSyntax(){let stack=[],issues=[];tokenize(editor.value).forEach(tok=>{if(tok.s==='{')stack.push(tok.line);else if(tok.s==='}'){if(stack.length)stack.pop();else issues.push('Line '+tok.line+': unexpected closing brace')}});if(stack.length)issues.push('Unclosed brace opened on line '+stack[stack.length-1]);return issues}
function run(){consoleEntries=[];outputEntries=[];errorEntries=[];activeTab='console';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab==='console'));addLog('Running '+currentFile,'cgood');let vars={},ticks=0;try{let problems=checkSyntax();if(problems.length)throw Error(problems.join('\n'));let tree=parse(editor.value);function exec(list){for(let n of list){if(++ticks>25000)throw Error('Safety limit: too many executed statements');if(n.type==='if'){exec(evalExpr(n.c,vars)?n.yes:n.no);continue}if(n.type==='while'){let loops=0;while(evalExpr(n.c,vars)){exec(n.b);if(++loops>10000)throw Error('Loop limit exceeded at line '+n.line)}continue}let s=n.s;if(s.startsWith('//'))continue;if(/^Say\s*\(/.test(s)){let end=s.lastIndexOf(')');if(end<0)throw Error('Line '+n.line+': Say missing closing parenthesis');let value=evalExpr(s.slice(s.indexOf('(')+1,end),vars);addLog(String(value),'cmuted','output');continue}let m=s.match(/^(int|float|str|bool)\s+(\w+)\s*=\s*(.+)$/);if(m){let [,type,name,ex]=m;let val=evalExpr(ex,vars);let valid=type==='int'?Number.isInteger(val)&&typeof val!=='boolean':type==='float'?typeof val==='number'&&typeof val!=='boolean':type==='str'?typeof val==='string':typeof val==='boolean';if(!valid)throw Error('Line '+n.line+': variable '+name+' does not match declared type '+type);vars[name]=val;continue}m=s.match(/^(\w+)\s*=\s*(.+)$/);if(m){if(!(m[1] in vars))throw Error('Line '+n.line+': unknown variable '+m[1]);vars[m[1]]=evalExpr(m[2],vars);continue}throw Error('Line '+n.line+': unrecognized command '+s}}exec(tree);addLog('Program finished','cgood')}catch(e){addLog('Flow Error: '+e.message,'cerr','errors');activeTab='errors';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab==='errors'))}paintConsole()}
$('runBtn').onclick=run;$('checkBtn').onclick=()=>{errorEntries=[];let e=checkSyntax();if(e.length)e.forEach(x=>addLog(x,'cerr','errors'));else addLog('Basic brace check passed.','cgood','output');activeTab=e.length?'errors':'output';document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('sel',b.dataset.tab===activeTab));paintConsole()};
function showTutorial(){showModal(`<h2>Flow Tutorial / Command Reference</h2><p>Flow is a typed, readable language. Indentation is optional. Unbraced If/While blocks contain only the next statement; braces group multiple statements.</p><div class="tutorial"><div class="lesson"><h3>Say — print output</h3><pre>Say("Hello world")\nSay(MyVariable)</pre>Displays text, a variable, or an expression in Output.</div><div class="lesson"><h3>Variables</h3><pre>int Score = 7\nfloat Speed = 2.5\nstr Name = "Player"\nbool Ready = true</pre>Types: int (whole number), float (decimal), str (text), bool (true/false). Names are case-sensitive.</div><div class="lesson"><h3>Assignment</h3><pre>Score = Score + 1</pre>Update a variable after it has been declared.</div><div class="lesson"><h3>Math and comparisons</h3><pre>+  -  *  /  %\n==  !=  &gt;  &lt;  &gt;=  &lt;=</pre>Parentheses can group expressions. Boolean words and, or, not are also accepted.</div><div class="lesson"><h3>If / Else</h3><pre>If Score &gt; 5 {\n Say("Above five")\n} Else {\n Say("Five or less")\n}</pre>Without braces, only the next statement belongs to If. Else is optional.</div><div class="lesson"><h3>While</h3><pre>int N = 3\nWhile N &gt; 0 {\n Say(N)\n N = N - 1\n}</pre>Repeats while the condition is true. Interpreter safety limits prevent runaway loops.</div><div class="lesson"><h3>Comments</h3><pre>// Flow ignores this line</pre>Comments begin with double slashes.</div><div class="lesson"><h3>Files</h3><pre>main.Flow\nNotes.doc_Flow</pre>Open and save Flow code as .Flow. The .doc_Flow extension is reserved for documentation text.</div><div class="lesson"><h3>Buttons</h3><pre>New · Open · Save · Run · Check</pre>New clears editor; Open loads a local text file; Save downloads source; Run executes supported commands; Check checks braces.</div></div><div class="modalfooter"><button onclick="closeModal()">Close</button></div>`)}$('tutorialBtn').onclick=showTutorial;
$('devBtn').onclick=()=>showModal('<h2>Developer Mode</h2><p>Enter the five-character access code.</p><input id="devcode" maxlength="5" placeholder="5 characters"><p id="devmsg" class="cerr"></p><div class="modalfooter"><button onclick="closeModal()">Cancel</button><button class="primary" onclick="unlock()">Unlock</button></div>');window.unlock=()=>{if($('devcode').value==='-----')showModal('<h2>Dev Mode unlocked</h2><p>Flow IDE 0.1 prototype diagnostics</p><pre>Interpreter: browser JS\nSupported: Say, typed vars, assignment, If/Else, While\nExtensions: .Flow and .doc_Flow</pre><p style="color:var(--bad)">The five-character code is embedded in client-side JavaScript and is not secure authentication.</p><div class="modalfooter"><button onclick="closeModal()">Close</button></div>');else $('devmsg').textContent='Incorrect code.'};paintConsole();
</script></body></html>
